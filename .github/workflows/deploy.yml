name: Deploy edge functions

on:
  push:
    branches: [main]

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Edge Functions
        # --yes: newer CLI versions ask for confirmation before deploying all functions,
        # and a CI run cannot answer, so every deploy since 2026-11-16 stopped there.
        run: supabase functions deploy --yes --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
